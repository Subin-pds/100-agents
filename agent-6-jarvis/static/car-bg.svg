<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a9d9f"/>
      <stop offset="55%" stop-color="#787b7d"/>
      <stop offset="100%" stop-color="#5c5f61"/>
    </linearGradient>
  </defs>

  <!-- Compact hatchback side silhouette, granite-grey, evoking an Alto-class shape -->
  <g fill="url(#body)">
    <path d="
      M 90 250
      C 95 190, 140 165, 190 160
      L 240 120
      C 270 98, 310 88, 350 88
      L 470 88
      C 512 88, 548 100, 575 122
      L 615 158
      C 660 162, 695 178, 705 220
      L 708 250
      L 90 250
      Z" />
    <!-- window band -->
    <path d="
      M 210 158
      L 255 122
      C 280 104, 312 96, 345 96
      L 462 96
      C 498 96, 528 108, 552 128
      L 590 158
      Z" fill="#2c3238" opacity="0.55"/>
    <!-- door seam + handle hint -->
    <line x1="400" y1="160" x2="400" y2="248" stroke="#3f4345" stroke-width="2" opacity="0.4"/>
    <rect x="335" y="185" width="26" height="6" rx="3" fill="#3f4345" opacity="0.5"/>
  </g>

  <!-- wheels -->
  <g>
    <circle cx="230" cy="255" r="46" fill="#1c1f22"/>
    <circle cx="230" cy="255" r="24" fill="#4a4d4f"/>
    <circle cx="580" cy="255" r="46" fill="#1c1f22"/>
    <circle cx="580" cy="255" r="24" fill="#4a4d4f"/>
  </g>

  <!-- ground shadow -->
  <ellipse cx="400" cy="308" rx="340" ry="14" fill="#000" opacity="0.25"/>
</svg>
